name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: job
          POSTGRES_PASSWORD: job
          POSTGRES_DB: job_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U job -d job_system_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://job:job@localhost:5432/job_system_test
      TEST_REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (+ architecture boundaries)
        run: pnpm turbo lint

      - name: Typecheck
        run: pnpm turbo typecheck

      - name: Tests (unit + integration against real Postgres/Redis)
        run: pnpm turbo test --concurrency=1

      - name: Migrations from an empty database
        run: |
          PGPASSWORD=job psql -h localhost -U job -d postgres \
            -c "DROP DATABASE IF EXISTS ci_migrations_check;" \
            -c "CREATE DATABASE ci_migrations_check;"
          DATABASE_URL=postgres://job:job@localhost:5432/ci_migrations_check \
            pnpm --filter @job-system/database db:migrate

      - name: Build
        run: pnpm turbo build

      - name: Secret scanning (gitleaks, full history)
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.1 detect \
            --source=/repo --config=/repo/.gitleaks.toml --redact -v --exit-code=2 --log-opts="--all"

      - name: Dependency audit (blocking, 0 HIGH required)
        run: pnpm audit --prod --audit-level high

  e2e:
    name: Playwright E2E (api + worker + web + postgres + redis)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # Runs docker/docker-compose.test.yml (postgres+redis), migrations, api,
      # worker, web build and the Playwright smoke suite. Never targets real
      # job platforms; only the local mock source and the local UI are used.
      - name: UI E2E smoke
        run: pnpm test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore