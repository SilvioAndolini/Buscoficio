name: job-system-test

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_USER: job
      POSTGRES_PASSWORD: job
      POSTGRES_DB: job_system_test
    ports:
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U job -d job_system_test']
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30
    networks: [internal]

networks:
  internal:
    driver: bridge